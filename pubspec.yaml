name: industryhub
description: "A practical operations workspace for Malaysian industrial SMEs."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.0
  flutter_riverpod: ^3.3.1
  go_router: ^17.1.0
  google_fonts: ^7.0.0
  http: ^1.6.0
  html: ^0.15.5
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  sqflite: ^2.4.3
  path: ^1.9.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true
  assets:
    - .env
    - assets/data/skillmatch_role_profiles.json
